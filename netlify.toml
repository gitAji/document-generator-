[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

# Same-origin path the React app calls, proxied to the Netlify Function.
# Keeps API calls working the same way in dev (`netlify dev`) and prod.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
